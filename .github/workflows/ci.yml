name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install
        run: uv sync --frozen --group research
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('tests/**') }}
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run pyright
      - name: Test
        run: uv run pytest -q

  # The package as a new user installs it: the built wheel alone with [entities] (real GLiNER),
  # at the oldest declared versions and at the latest ones.
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            pins: "torch==2.4.1 transformers==4.56.0"
          - python-version: "3.12"
            pins: ""
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build
        run: uv build --out-dir dist
      - name: Install the wheel in a fresh environment
        run: |
          uv venv /tmp/pkg --python ${{ matrix.python-version }}
          uv pip install --python /tmp/pkg/bin/python \
            --extra-index-url https://download.pytorch.org/whl/cpu --index-strategy unsafe-best-match \
            "$(ls dist/*.whl)[entities]" ${{ matrix.pins }}
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-package-${{ hashFiles('tests/package_smoke.py') }}
      - name: Smoke test
        run: cd /tmp && /tmp/pkg/bin/python "$GITHUB_WORKSPACE/tests/package_smoke.py"
