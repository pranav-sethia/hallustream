[project]
name = "hallustream"
version = "0.2.0"
description = "Flag the facts an open LLM is probably making up, from its hidden states, as it writes."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Pranav Sethia", email = "pranav.sethia5@gmail.com" }]
requires-python = ">=3.10"
keywords = ["llm", "hallucination", "probe", "interpretability", "qwen3", "streaming"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.4",
    "transformers>=4.56",
    "safetensors>=0.4",
    "numpy>=1.26",
    "pysbd>=0.3.4",
]

[project.scripts]
hallustream = "hallustream.cli:main"

[project.optional-dependencies]
# protobuf: GLiNER's DeBERTa tokenizer can't be converted without it under transformers 5
entities = ["gliner>=0.2.24", "protobuf>=4"]

[dependency-groups]
# Training, evaluation and fact checking (src/hallustream/research, modal_jobs); not published.
research = [
    "torch>=2.8",
    "transformers>=5.20,<6",
    "huggingface_hub>=1.0",
    "datasets>=3.0",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "pyarrow>=17",
    "wandb>=0.19",
    "anthropic>=0.60",
    "matplotlib>=3.10.9",
    "google-genai>=2.32.0",
    "gliner>=0.2.24; python_version >= '3.11'",  # its onnxruntime pin has no 3.10 Linux wheel
    "pysbd>=0.3.4",
    "sentencepiece>=0.2.2",
    "protobuf>=7.36.2",
]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "pre-commit>=4",
    "modal>=1.6",
]

[project.urls]
Homepage = "https://pranav-sethia.github.io/hallustream/"
Repository = "https://github.com/pranav-sethia/hallustream"

[tool.uv.build-backend]
# The research code (training, evaluation, fact checking) stays in the repo, not in the wheel.
wheel-exclude = ["hallustream/research/**"]

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["src/hallustream"]
exclude = ["src/hallustream/research"]
typeCheckingMode = "basic"
pythonVersion = "3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
